# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Network resilience — retry on chunked transfer failures
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.http.keepAlive=false
systemProp.maven.wagon.rto=30000
systemProp.maven.wagon.http.retryHandler.count=5

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.4
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
modmenu_version=13.0.4
maven_group=com.namelessgod2008

# Dependencies
fabric_api_version=0.119.4+1.21.4
carpet_version=1.4.161
rei_version=18.0.815
